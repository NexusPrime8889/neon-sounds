
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SOUND MARKET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#050811;
  --panel:#0c1425;
  --panel2:#101d33;
  --blue:#00b7ff;
  --cyan:#00f0ff;
  --text:#f2f8ff;
  --muted:#8da4bd;
  --border:#173653;
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(ellipse at top,#102b48 0,#050811 55%);
  color:var(--text);font-family:Montserrat,sans-serif;min-height:100vh;
}
header{
  padding:24px 5%;display:flex;align-items:center;justify-content:space-between;
  gap:15px;flex-wrap:wrap;border-bottom:1px solid var(--border);
  background:#050811dd;position:sticky;top:0;z-index:5;backdrop-filter:blur(15px);
}
.logo{font-size:22px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--cyan);text-shadow:0 0 15px var(--blue)}
nav{display:flex;gap:10px;flex-wrap:wrap}
button,.button{
  border:1px solid var(--blue);background:#071b30;color:white;
  padding:11px 16px;border-radius:10px;font-weight:800;
  font-family:inherit;cursor:pointer;text-decoration:none;
}
button:hover,.button:hover{background:var(--blue);color:#00111d}
main{max-width:1250px;margin:auto;padding:35px 20px}
.hero{text-align:center;padding:40px 10px}
.hero h1{font-size:clamp(30px,6vw,55px);margin:0 0 12px;font-weight:900}
.hero h1 span{color:var(--cyan);text-shadow:0 0 25px #00b7ff88}
.hero p{color:var(--muted);line-height:1.7}
.searchbar{
  width:min(650px,100%);margin:25px auto;display:flex;gap:10px;
}
input,select{
  background:#0b1728;color:white;border:1px solid var(--border);
  border-radius:10px;padding:14px;font-family:inherit;outline:none;width:100%;
}
input:focus,select:focus{border-color:var(--cyan)}
.section-title{font-size:21px;font-weight:900;margin:35px 0 17px}
.categories{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.category.active{background:var(--blue);color:#00111d}
.games{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;
}
.game{
  background:var(--panel);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;
}
.game:hover{transform:translateY(-4px);border-color:var(--cyan)}
.game img{width:100%;height:100px;object-fit:cover;display:block}
.game div{padding:12px;font-size:12px;font-weight:800;text-align:center}
.sounds{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px;
}
.sound{
  background:linear-gradient(145deg,#101d33,#09111e);
  border:1px solid var(--border);border-radius:15px;padding:17px;
}
.sound h3{margin:0 0 8px;font-size:15px}
.sound small{color:var(--muted)}
.sound audio{width:100%;margin-top:14px}
.sound-actions{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.sound-actions a{color:var(--cyan);font-size:12px;text-decoration:none;font-weight:800}
.upload-box{
  background:var(--panel);border:1px solid var(--blue);
  box-shadow:0 0 25px #00b7ff16;border-radius:18px;padding:25px;
  margin-top:45px;
}
.upload-box h2{margin-top:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
#status{color:var(--cyan);font-size:13px;margin-top:15px}
.empty{color:var(--muted);text-align:center;padding:35px}
footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}
@media(max-width:600px){
  header{justify-content:center}
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:auto}
}
</style>
</head>

<body>
<header>
  <div class="logo">NEON <span>SOUND MARKET</span></div>
  <nav>
    <button onclick="document.getElementById('library').scrollIntoView()">Biblioteca</button>
    <button onclick="document.getElementById('upload').scrollIntoView()">Subir sonido</button>
  </nav>
</header>

<main>
  <section class="hero">
    <h1>NEON <span>SOUND MARKET</span></h1>
    <p>Descubre, escucha y comparte sonidos de tus juegos favoritos de Roblox.</p>
    <div class="searchbar">
      <input id="search" placeholder="Buscar sonidos..." oninput="renderSounds()">
    </div>
  </section>

  <h2 class="section-title">JUEGOS</h2>
  <div class="games" id="games"></div>

  <section id="library">
    <h2 class="section-title">BIBLIOTECA DE SONIDOS</h2>
    <div class="categories" id="categories"></div>
    <div class="sounds" id="sounds">
      <div class="empty">Cargando biblioteca...</div>
    </div>
  </section>

  <section class="upload-box" id="upload">
    <h2>⬆ SUBIR UN SONIDO</h2>
    <p style="color:var(--muted)">Comparte tus sonidos con toda la comunidad.</p>

    <div class="form-grid">
      <input id="soundName" placeholder="Nombre del sonido">
      <select id="gameSelect">
        <option>Steal an Egg</option>
        <option>Steal a Brainrot</option>
        <option>Murder Mystery 2</option>
        <option>Brookhaven</option>
        <option>Adopt Me!</option>
        <option>Blox Fruits</option>
        <option>Otros juegos</option>
      </select>
      <select id="rarity">
        <option>Normal</option>
        <option>Rare</option>
        <option>Epic</option>
        <option>Legendary</option>
        <option>Secret</option>
        <option>Eternal</option>
        <option>Divino</option>
      </select>
      <input id="soundFile" type="file" accept=".mp3,.wav,.ogg,.m4a,audio/*">
      <button class="full" onclick="uploadSound()">PUBLICAR SONIDO</button>
    </div>
    <div id="status"></div>
  </section>
</main>

<footer>NEON SOUND MARKET · Biblioteca comunitaria de sonidos</footer>

<script>
const SUPABASE_URL = "https://wcvqpdkgysfavulgtqru.supabase.co";
const SUPABASE_KEY = "sb_publishable_ynKq7LSvepCoGFPhddz3Fg_9lOb2ZrL";
const BUCKET = "neon-sounds";

const games = [
  {name:"Steal an Egg",id:0,emoji:"🥚"},
  {name:"Steal a Brainrot",id:0,emoji:"🧠"},
  {name:"Murder Mystery 2",id:142823291,id2:0,emoji:"🔪"},
  {name:"Brookhaven",id:0,emoji:"🏡"},
  {name:"Adopt Me!",id:0,emoji:"🐶"},
  {name:"Blox Fruits",id:0,emoji:"🍎"},
  {name:"Otros juegos",id:0,emoji:"🎮"}
];

let allSounds = [];
let selectedGame = "Todos";

function headers(){
  return {
    apikey:SUPABASE_KEY,
    Authorization:"Bearer "+SUPABASE_KEY
  };
}

function showStatus(message){
  document.getElementById("status").textContent=message;
}

function renderGames(){
  const root=document.getElementById("games");
  root.innerHTML="";
  games.forEach(game=>{
    const card=document.createElement("div");
    card.className="game";
    const image=document.createElement("div");
    image.style.cssText="height:100px;display:grid;place-items:center;font-size:38px;background:#102b48";
    image.textContent=game.emoji;
    const name=document.createElement("div");
    name.textContent=game.name;
    card.append(image,name);
    card.onclick=()=>{
      selectedGame=game.name;
      renderCategories();
      renderSounds();
      document.getElementById("library").scrollIntoView();
    };
    root.appendChild(card);
  });
}

function renderCategories(){
  const root=document.getElementById("categories");
  root.innerHTML="";
  ["Todos",...games.map(g=>g.name)].forEach(name=>{
    const button=document.createElement("button");
    button.className="category"+(selectedGame===name?" active":"");
    button.textContent=name;
    button.onclick=()=>{
      selectedGame=name;
      renderCategories();
      renderSounds();
    };
    root.appendChild(button);
  });
}

function parseFileName(name){
  const parts=name.split("--");
  return {
    game:parts.length>=3?parts[0].replace(/-/g," "):"Otros juegos",
    rarity:parts.length>=3?parts[1]:"Normal",
    title:parts.length>=3?parts.slice(2).join("--") : name
  };
}

async function loadSounds(){
  try{
    const response=await fetch(
      `${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`,
      {
        method:"POST",
        headers:{...headers(),"Content-Type":"application/json"},
        body:JSON.stringify({prefix:"",limit:500,offset:0,sortBy:{column:"created_at",order:"desc"}})
      }
    );
    if(!response.ok) throw new Error("No se pudo leer el bucket ("+response.status+")");
    const files=await response.json();
    allSounds=files.filter(f=>f.name && !f.name.startsWith(".")).map(f=>{
      const meta=parseFileName(f.name);
      return {
        ...meta,
        file:f.name,
        url:`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${f.name}`,
        date:f.created_at || f.updated_at || ""
      };
    });
    renderSounds();
  }catch(error){
    document.getElementById("sounds").innerHTML=
      '<div class="empty">No se pudo cargar la biblioteca. Revisa la configuración pública de Supabase.</div>';
    console.error(error);
  }
}

function renderSounds(){
  const root=document.getElementById("sounds");
  const query=document.getElementById("search").value.toLowerCase().trim();
  const filtered=allSounds.filter(s=>
    (selectedGame==="Todos" || s.game.toLowerCase()===selectedGame.toLowerCase()) &&
    (s.title.toLowerCase().includes(query) ||
     s.game.toLowerCase().includes(query) ||
     s.rarity.toLowerCase().includes(query))
  );

  root.innerHTML="";
  if(!filtered.length){
    root.innerHTML='<div class="empty">Todavía no hay sonidos en esta categoría.</div>';
    return;
  }

  filtered.forEach(sound=>{
    const card=document.createElement("article");
    card.className="sound";

    const title=document.createElement("h3");
    title.textContent=sound.title;

    const info=document.createElement("small");
    info.textContent=sound.game+" · "+sound.rarity;

    const audio=document.createElement("audio");
    audio.controls=true;
    audio.preload="none";
    audio.src=sound.url;

    const actions=document.createElement("div");
    actions.className="sound-actions";
    const download=document.createElement("a");
    download.href=sound.url;
    download.download=sound.file;
    download.textContent="DESCARGAR";
    actions.appendChild(download);

    card.append(title,info,audio,actions);
    root.appendChild(card);
  });
}

async function uploadSound(){
  const name=document.getElementById("soundName").value.trim();
  const game=document.getElementById("gameSelect").value;
  const rarity=document.getElementById("rarity").value;
  const file=document.getElementById("soundFile").files[0];

  if(SUPABASE_KEY==="PEGA_TU_CLAVE_PUBLICABLE"){
    showStatus("Primero coloca tu clave Publishable en el código.");
    return;
  }
  if(!name || !file){
    showStatus("Escribe un nombre y selecciona un archivo.");
    return;
  }
  const allowed=["audio/mpeg","audio/wav","audio/ogg","audio/mp4","audio/x-m4a"];
  const extension=file.name.split(".").pop().toLowerCase();
  if(!["mp3","wav","ogg","m4a"].includes(extension) ||
     (file.type && !allowed.includes(file.type))){
    showStatus("Formato no permitido. Usa MP3, WAV, OGG o M4A.");
    return;
  }
  if(file.size>15*1024*1024){
    showStatus("El archivo supera el límite de 15 MB.");
    return;
  }

  const slug=textSlug(name);
  const gameSlug=textSlug(game);
  const fileName=`${gameSlug}--${rarity.toLowerCase()}--${slug}-${crypto.randomUUID()}.${extension}`;

  showStatus("Subiendo sonido...");
  try{
    const response=await fetch(
      `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodeURIComponent(fileName)}`,
      {
        method:"POST",
        headers:{
          ...headers(),
          "Content-Type":file.type || "application/octet-stream",
          "x-upsert":"false"
        },
        body:file
      }
    );
    if(!response.ok){
      const detail=await response.text();
      throw new Error(detail || "Error "+response.status);
    }
    showStatus("¡Sonido publicado correctamente!");
    document.getElementById("soundName").value="";
    document.getElementById("soundFile").value="";
    await loadSounds();
  }catch(error){
    showStatus("Error al subir: "+error.message);
  }
}

function textSlug(text){
  return text.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50);
}

renderGames();
renderCategories();
loadSounds();
</script>
</body>
</html>
