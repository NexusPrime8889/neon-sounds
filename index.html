
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SOUND MARKET</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#090a19;
  --panel:#19182f;
  --blue:#00b7ff;
  --cyan:#00efff;
  --green:#72ff19;
  --text:#fff;
  --muted:#c0bdd9;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Montserrat,sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 5px 5px,#393651 1.7px,transparent 2.5px);
  background-size:12px 12px;
}

/* TEXTURA STUDS */
.studs{
  background-color:#19182f;
  background-image:radial-gradient(circle at 5px 5px,#393651 1.7px,transparent 2.5px);
  background-size:12px 12px;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:20;
  padding:15px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:15px;
  background:#090b19;
  border-bottom:4px solid #000;
  box-shadow:0 4px 0 var(--blue),0 8px 25px #00b7ff30;
}

.logo{
  font-size:21px;
  font-weight:900;
  text-shadow:2px 2px #000;
}

.logo span{color:var(--cyan)}

nav{display:flex;gap:10px;flex-wrap:wrap}

button{
  font-family:Montserrat,sans-serif;
  font-weight:900;
  color:white;
  cursor:pointer;
  border:3px solid #05050b;
  border-radius:5px;
  padding:11px 16px;
  background:linear-gradient(#168bff,#0056c9);
  box-shadow:0 4px 0 #002d68;
  text-shadow:1px 2px #000;
}

button:hover{filter:brightness(1.2);transform:translateY(-2px)}

main{max-width:1250px;margin:auto;padding:30px 20px}

/* HERO */
.hero{
  text-align:center;
  padding:40px 15px;
  margin-bottom:30px;
  border:4px solid #000;
  background-color:#17172e;
  background-image:radial-gradient(circle at 5px 5px,#42405c 1.8px,transparent 2.5px);
  background-size:12px 12px;
  box-shadow:0 5px 0 var(--blue),0 12px 30px #0008;
}

.hero h1{
  font-size:clamp(30px,6vw,55px);
  font-weight:900;
  margin:0 0 12px;
  color:white;
  -webkit-text-stroke:1px #000;
  text-shadow:3px 3px #000,5px 5px #003d75,0 0 20px var(--blue);
}

.hero h1 span{color:var(--cyan)}

.hero p{
  color:#e0e6ff;
  font-weight:800;
  text-shadow:1px 2px #000;
}

.searchbar{width:min(650px,100%);margin:25px auto 0}

input,select{
  width:100%;
  padding:14px;
  border:3px solid #05050b;
  border-radius:5px;
  background:#252440;
  color:white;
  font-family:Montserrat,sans-serif;
  font-weight:700;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--cyan);
  box-shadow:0 0 12px #00b7ff70;
}

input::placeholder{color:#aaa8c7}

/* TITULOS */
.section-title{
  display:block;
  width:fit-content;
  max-width:100%;
  padding:10px 18px;
  margin:35px 0 20px;
  font-size:19px;
  font-weight:900;
  color:white;
  background:linear-gradient(90deg,#006bc9,#123e91);
  border:3px solid #05050b;
  box-shadow:0 4px 0 #001d49,0 0 12px #00b7ff50;
  text-shadow:2px 2px #000;
}

/* JUEGOS */
.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:15px;
}

.game{
  overflow:hidden;
  cursor:pointer;
  background:#19182f;
  border:4px solid #05050b;
  box-shadow:0 4px 0 #003b75,0 0 12px #00b7ff25;
  transition:.2s;
}

.game:hover{
  transform:translateY(-4px);
  border-color:var(--blue);
}

.game-cover{
  width:100%;
  height:125px;
  display:block;
  object-fit:cover;
  background:#20203b;
}

.game-fallback{
  width:100%;
  height:125px;
  display:grid;
  place-items:center;
  font-size:45px;
  background-color:#1b1a35;
  background-image:radial-gradient(circle,#45415f 1.5px,transparent 2px);
  background-size:10px 10px;
}

.game-name{
  padding:12px 7px;
  text-align:center;
  font-size:12px;
  font-weight:900;
  text-shadow:2px 2px #000;
}

/* CATEGORIAS */
.categories{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:25px;
}

.category{background:#24213f}

.category.active{
  background:linear-gradient(#8aff30,#36b900);
  color:#071300;
  text-shadow:none;
  box-shadow:0 4px 0 #176400;
}

/* BIBLIOTECA */
.sounds{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:17px;
}

.sound{
  padding:17px;
  background-color:#19182f;
  background-image:radial-gradient(circle at 5px 5px,#34324f 1.5px,transparent 2px);
  background-size:11px 11px;
  border:4px solid #05050b;
  box-shadow:0 4px 0 #004b91,0 0 14px #00b7ff20;
}

.sound h3{
  margin:0 0 9px;
  font-size:15px;
  font-weight:900;
  text-shadow:2px 2px #000;
  overflow-wrap:anywhere;
}

.sound small{
  color:var(--cyan);
  font-weight:800;
}

.sound audio{width:100%;margin-top:15px}

.sound-actions{
  display:flex;
  justify-content:space-between;
  margin-top:13px;
}

.sound-actions a{
  color:var(--cyan);
  font-size:12px;
  font-weight:900;
  text-decoration:none;
}

/* SUBIR */
.upload-box{
  margin-top:45px;
  padding:25px;
  background-color:#19182f;
  background-image:radial-gradient(circle at 5px 5px,#34324f 1.5px,transparent 2px);
  background-size:11px 11px;
  border:4px solid #05050b;
  box-shadow:0 5px 0 var(--blue),0 0 25px #00b7ff25;
}

.upload-box h2{
  margin-top:0;
  font-weight:900;
  text-shadow:2px 2px #000;
}

.upload-box p{color:var(--muted);font-weight:600}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.form-grid .full{grid-column:1/-1}

.form-grid button{
  background:linear-gradient(#8aff30,#38c500);
  color:#071300;
  text-shadow:1px 1px #baff91;
  box-shadow:0 4px 0 #176400;
}

#status{
  color:var(--cyan);
  font-size:13px;
  font-weight:800;
  margin-top:16px;
  overflow-wrap:anywhere;
}

.empty{
  color:#c2bfdc;
  text-align:center;
  padding:35px;
  font-weight:700;
  background:#15142a;
  border:3px solid #05050b;
}

footer{
  text-align:center;
  padding:30px;
  color:#aaa8c7;
  font-size:12px;
  font-weight:700;
}

@media(max-width:600px){
  header{justify-content:center}
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:auto}
}
</style>
</head>

<body>

<header>
  <div class="logo">NEON <span>SOUND MARKET</span></div>
  <nav>
    <button onclick="document.getElementById('library').scrollIntoView({behavior:'smooth'})">BIBLIOTECA</button>
    <button onclick="document.getElementById('upload').scrollIntoView({behavior:'smooth'})">SUBIR SONIDO</button>
  </nav>
</header>

<main>

<section class="hero">
  <h1>NEON <span>SOUND MARKET</span></h1>
  <p>DESCUBRE · ESCUCHA · COMPARTE SONIDOS DE ROBLOX</p>
  <div class="searchbar">
    <input id="search" placeholder="Buscar sonidos..." oninput="renderSounds()">
  </div>
</section>

<h2 class="section-title">🎮 JUEGOS</h2>
<div class="games" id="games"></div>

<section id="library">
  <h2 class="section-title">🎵 BIBLIOTECA DE SONIDOS</h2>
  <div class="categories" id="categories"></div>
  <div class="sounds" id="sounds">
    <div class="empty">Cargando biblioteca...</div>
  </div>
</section>

<section class="upload-box" id="upload">
  <h2>⬆ SUBIR UN SONIDO</h2>
  <p>COMPARTE TUS SONIDOS CON TODA LA COMUNIDAD.</p>

  <div class="form-grid">
    <input id="soundName" placeholder="Nombre del sonido">

    <select id="gameSelect">
      <option>Steal an Egg</option>
      <option>Steal a Brainrot</option>
      <option>Murder Mystery 2</option>
      <option>Brookhaven</option>
      <option>Adopt Me!</option>
      <option>Blox Fruits</option>
      <option>Otros juegos</option>
    </select>

    <select id="rarity">
      <option>Normal</option>
      <option>Rare</option>
      <option>Epic</option>
      <option>Legendary</option>
      <option>Secret</option>
      <option>Eternal</option>
      <option>Divino</option>
    </select>

    <input id="soundFile" type="file" accept=".mp3,.wav,.ogg,.m4a,audio/*">

    <button class="full" onclick="uploadSound()">PUBLICAR SONIDO</button>
  </div>

  <div id="status"></div>
</section>

</main>

<footer>NEON SOUND MARKET · ROBLOX SOUND COMMUNITY</footer>

<script>
const SUPABASE_URL = "https://wcvqpdkgysfavulgtqru.supabase.co";
const SUPABASE_KEY = "sb_publishable_ynKq7LSvepCoGFPhddz3Fg_9lOb2ZrL";
const BUCKET = "neon-sounds";

/* PORTADAS DE LOS JUEGOS */
const games = [
  {
    name:"Steal an Egg",
    image:"steal-an-egg.png",
    emoji:"🥚"
  },
  {
    name:"Steal a Brainrot",
    image:"steal-a-brainrot.webp",
    emoji:"🧠"
  },
  {
    name:"Murder Mystery 2",
    placeId:142823291,
    emoji:"🔪"
  },
  {
    name:"Brookhaven",
    placeId:4924922222,
    emoji:"🏡"
  },
  {
    name:"Adopt Me!",
    placeId:920587237,
    emoji:"🐶"
  },
  {
    name:"Blox Fruits",
    placeId:2753915549,
    emoji:"🍎"
  },
  {
    name:"Otros juegos",
    emoji:"🎮"
  }
];

let allSounds=[];
let selectedGame="Todos";

function headers(){
  return {
    apikey:SUPABASE_KEY,
    Authorization:"Bearer "+SUPABASE_KEY
  };
}

function textSlug(text){
  return text.normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"")
    .slice(0,50);
}

function showStatus(message){
  document.getElementById("status").textContent=message;
}

/* PORTADA DE RESPALDO */
function showFallback(container,emoji){
  const fallback=document.createElement("div");
  fallback.className="game-fallback";
  fallback.textContent=emoji||"🎮";
  container.replaceChildren(fallback);
}

/* CARGAR PORTADAS */
function renderGames(){
  const root=document.getElementById("games");
  root.innerHTML="";

  games.forEach(game=>{
    const card=document.createElement("div");
    card.className="game";

    const name=document.createElement("div");
    name.className="game-name";
    name.textContent=game.name;

    const cover=document.createElement("img");
    cover.className="game-cover";
    cover.alt="Portada de "+game.name;
    cover.loading="lazy";

    card.appendChild(cover);
    card.appendChild(name);

    /* Imágenes guardadas en GitHub */
    if(game.image){
      cover.src=game.image;
      cover.onerror=()=>showFallback(card,game.emoji);
    }

    /* Portadas obtenidas de Roblox */
    else if(game.placeId){
      showFallback(card,game.emoji);

      fetch(
        `https://thumbnails.roblox.com/v1/places/gameicons?placeIds=${game.placeId}&size=512x512&format=Png&isCircular=false`
      )
      .then(response=>{
        if(!response.ok) throw new Error("Thumbnail no disponible");
        return response.json();
      })
      .then(data=>{
        const imageUrl=data.data?.[0]?.imageUrl;

        if(imageUrl){
          cover.src=imageUrl;
          card.replaceChildren(cover,name);
        }
      })
      .catch(error=>console.warn("Portada:",game.name,error));
    }

    else{
      showFallback(card,game.emoji);
    }

    card.onclick=()=>{
      selectedGame=game.name;
      renderCategories();
      renderSounds();
      document.getElementById("library").scrollIntoView({behavior:"smooth"});
    };

    root.appendChild(card);
  });
}

/* CATEGORIAS */
function renderCategories(){
  const root=document.getElementById("categories");
  root.innerHTML="";

  ["Todos",...games.map(g=>g.name)].forEach(name=>{
    const button=document.createElement("button");
    button.className="category"+(selectedGame===name?" active":"");
    button.textContent=name;

    button.onclick=()=>{
      selectedGame=name;
      renderCategories();
      renderSounds();
    };

    root.appendChild(button);
  });
}

/* LEER NOMBRE DE ARCHIVO */
function parseFileName(name){
  const parts=name.split("--");

  const gameSlug=parts.length>=3?parts[0]:"otros-juegos";
  const matchedGame=games.find(g=>textSlug(g.name)===gameSlug);

  return {
    game:matchedGame?matchedGame.name:"Otros juegos",
    rarity:parts.length>=3?parts[1]:"Normal",
    title:parts.length>=3?parts.slice(2).join("--"):name
  };
}

/* CARGAR BIBLIOTECA */
async function loadSounds(){
  try{
    const response=await fetch(
      `${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`,
      {
        method:"POST",
        headers:{
          ...headers(),
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          prefix:"",
          limit:500,
          offset:0,
          sortBy:{column:"created_at",order:"desc"}
        })
      }
    );

    if(!response.ok){
      throw new Error("No se pudo leer el bucket ("+response.status+")");
    }

    const files=await response.json();

    allSounds=files
      .filter(file=>file.name&&!file.name.startsWith("."))
      .map(file=>{
        const meta=parseFileName(file.name);

        return {
          ...meta,
          file:file.name,
          url:`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${file.name.split("/").map(encodeURIComponent).join("/")}`,
          date:file.created_at||file.updated_at||""
        };
      });

    renderSounds();

  }catch(error){
    document.getElementById("sounds").innerHTML=
      '<div class="empty">No se pudo cargar la biblioteca. Comprueba las políticas SELECT de Supabase.</div>';

    console.error(error);
  }
}

/* MOSTRAR SONIDOS */
function renderSounds(){
  const root=document.getElementById("sounds");
  const query=document.getElementById("search").value.toLowerCase().trim();

  const filtered=allSounds.filter(sound=>
    (selectedGame==="Todos"||
      sound.game.toLowerCase()===selectedGame.toLowerCase())&&
    (
      sound.title.toLowerCase().includes(query)||
      sound.game.toLowerCase().includes(query)||
      sound.rarity.toLowerCase().includes(query)
    )
  );

  root.innerHTML="";

  if(!filtered.length){
    root.innerHTML='<div class="empty">TODAVÍA NO HAY SONIDOS EN ESTA CATEGORÍA.</div>';
    return;
  }

  filtered.forEach(sound=>{
    const card=document.createElement("article");
    card.className="sound";

    const title=document.createElement("h3");
    title.textContent=sound.title;

    const info=document.createElement("small");
    info.textContent=sound.game+" · "+sound.rarity;

    const audio=document.createElement("audio");
    audio.controls=true;
    audio.preload="none";
    audio.src=sound.url;

    const actions=document.createElement("div");
    actions.className="sound-actions";

    const download=document.createElement("a");
    download.href=sound.url;
    download.download=sound.file;
    download.textContent="⬇ DESCARGAR";

    actions.appendChild(download);
    card.append(title,info,audio,actions);
    root.appendChild(card);
  });
}

/* SUBIR SONIDOS */
async function uploadSound(){
  const name=document.getElementById("soundName").value.trim();
  const game=document.getElementById("gameSelect").value;
  const rarity=document.getElementById("rarity").value;
  const file=document.getElementById("soundFile").files[0];

  if(!name||!file){
    showStatus("Escribe un nombre y selecciona un archivo.");
    return;
  }

  const extension=file.name.split(".").pop().toLowerCase();
  const allowed=["mp3","wav","ogg","m4a"];

  if(!allowed.includes(extension)){
    showStatus("Formato no permitido. Usa MP3, WAV, OGG o M4A.");
    return;
  }

  if(file.size>15*1024*1024){
    showStatus("El archivo supera el límite de 15 MB.");
    return;
  }

  const mimeTypes={
    mp3:"audio/mpeg",
    wav:"audio/wav",
    ogg:"audio/ogg",
    m4a:"audio/mp4"
  };

  const fileName=
    `${textSlug(game)}--${rarity.toLowerCase()}--${textSlug(name)}-${crypto.randomUUID()}.${extension}`;

  showStatus("SUBIENDO SONIDO...");

  try{
    const response=await fetch(
      `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodeURIComponent(fileName)}`,
      {
        method:"POST",
        headers:{
          ...headers(),
          "Content-Type":mimeTypes[extension],
          "x-upsert":"false"
        },
        body:file
      }
    );

    if(!response.ok){
      const detail=await response.text();
      throw new Error(detail||"Error "+response.status);
    }

    showStatus("¡SONIDO PUBLICADO CORRECTAMENTE!");

    document.getElementById("soundName").value="";
    document.getElementById("soundFile").value="";

    await loadSounds();

  }catch(error){
    showStatus("ERROR AL SUBIR: "+error.message);
  }
}

/* INICIAR */
renderGames();
renderCategories();
loadSounds();
</script>

</body>
</html>
